<style>
body{margin:0;background:#050F19}
a{color:#DCE9F2;text-decoration:none}
a:hover{color:#FFFFFF;text-decoration:underline;text-decoration-color:#F0803C;text-decoration-thickness:1.5px;text-underline-offset:4px}
a:focus-visible{outline:2px solid #F0803C;outline-offset:3px;border-radius:4px}
.sub{color:#9DB5C5}
.sub:hover{color:#FFFFFF}
.cta:hover{background:#FF9A5C;color:#08182A;text-decoration:none}
.ghost:hover{border-color:#CFE3EE;color:#FFFFFF;text-decoration:none}
@keyframes drift {
  to { stroke-dashoffset: calc(var(--len) * -1); }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes flow {
  to { stroke-dashoffset: -14; }
}
@keyframes sail {
  0% { transform: translate(-7px, 0); }
  50% { transform: translate(7px, -1.5px); }
  100% { transform: translate(-7px, 0); }
}
@keyframes glide {
  0% { transform: translateX(0); }
  50% { transform: translateX(34px); }
  100% { transform: translateX(0); }
}
@keyframes blink {
  0% { opacity: 1; }
  55% { opacity: 1; }
  62% { opacity: 0.12; }
  100% { opacity: 0.12; }
}
@keyframes rise {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: none; }
}
@keyframes twinkle {
  0% { opacity: 0.3; }
  50% { opacity: 0.95; }
  100% { opacity: 0.3; }
}
@keyframes pulse {
  0% { opacity: 0.6; }
  50% { opacity: 1; }
  100% { opacity: 0.6; }
}
@keyframes puff {
  0% { transform: translate(0, 0) scale(0.5); opacity: 0.6; }
  100% { transform: translate(-30px, -44px) scale(2.4); opacity: 0; }
}
.rise{animation:rise 0.9s cubic-bezier(0.2,0.7,0.2,1) both}
.spin{transform-box:view-box;transform-origin:720px 640px}
.spinA{animation:spin 260s linear infinite}
.spinB{animation:spin 220s linear infinite reverse}
.spinC{animation:spin 150s linear infinite}
.flow{animation:flow 1.4s linear infinite}
.stars-a{animation:twinkle 5s ease-in-out infinite}
.stars-b{animation:twinkle 7s ease-in-out -2.5s infinite}
.pulse{animation:pulse 4s ease-in-out infinite}
.wv{animation:drift 70s linear infinite}
.wv2{animation:drift 95s linear infinite reverse}
.ship{animation:sail 26s ease-in-out infinite}
.gull{animation:glide 16s ease-in-out infinite}
.bl{animation:blink 2.6s ease-in-out infinite}
.puff{transform-box:fill-box;transform-origin:center;animation:puff 6s ease-out infinite}
@media (prefers-reduced-motion: reduce) {
  .rise,.spinA,.spinB,.spinC,.flow,.stars-a,.stars-b,.pulse,.wv,.wv2,.ship,.gull,.bl,.puff{animation:none}
}
</style>
</helmet>
