<style>
body{margin:0;background:#07131F}
a{color:#DCE9F2;text-decoration:none}
a:hover{color:#FFFFFF;text-decoration:underline;text-decoration-color:#F0803C;text-decoration-thickness:1.5px;text-underline-offset:4px}
a:focus-visible,button:focus-visible{outline:2px solid #F0803C;outline-offset:3px;border-radius:4px}
.sub{color:#9DB5C5}
.sub:hover{color:#FFFFFF}
.cta:hover{background:#FF9A5C;color:#08182A;text-decoration:none}
.ghost:hover{border-color:#CFE3EE;color:#FFFFFF;text-decoration:none}
.lbl{display:block;margin:0 0 8px;font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:0.14em;text-transform:uppercase;color:#7FA6BC}
.fld{box-sizing:border-box;width:100%;padding:14px;border-radius:10px;border:1px solid rgba(207,227,238,0.28);background:rgba(207,227,238,0.06);color:#EAF3F8;font:400 15px/1.2 'Inter Tight',sans-serif;color-scheme:dark}
.fld::placeholder{color:#8AA3B4}
.fld:focus-visible{outline:2px solid #F0803C;outline-offset:2px;border-color:transparent}
@keyframes drift {
  to { stroke-dashoffset: calc(var(--len) * -1); }
}
@keyframes sail {
  0% { transform: translate(-7px, 0); }
  50% { transform: translate(7px, -1.5px); }
  100% { transform: translate(-7px, 0); }
}
@keyframes glide {
  0% { transform: translateX(0); }
  50% { transform: translateX(34px); }
  100% { transform: translateX(0); }
}
@keyframes blink {
  0% { opacity: 1; }
  55% { opacity: 1; }
  62% { opacity: 0.12; }
  100% { opacity: 0.12; }
}
@keyframes rise {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: none; }
}
@keyframes twinkle {
  0% { opacity: 0.3; }
  50% { opacity: 0.95; }
  100% { opacity: 0.3; }
}
@keyframes pulse {
  0% { opacity: 0.72; }
  50% { opacity: 1; }
  100% { opacity: 0.72; }
}
@keyframes puff {
  0% { transform: translate(0, 0) scale(0.5); opacity: 0.6; }
  100% { transform: translate(-30px, -44px) scale(2.4); opacity: 0; }
}
@keyframes trolleyL {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50px); }
}
@keyframes trolleyR {
  0% { transform: translateX(0); }
  100% { transform: translateX(50px); }
}
.rise{animation:rise 0.9s cubic-bezier(0.2,0.7,0.2,1) both}
.stars-a{animation:twinkle 5s ease-in-out infinite}
.stars-b{animation:twinkle 7s ease-in-out -2.5s infinite}
.glow{animation:pulse 9s ease-in-out infinite}
.wv{animation:drift 70s linear infinite}
.wv2{animation:drift 95s linear infinite reverse}
.ship{animation:sail 26s ease-in-out infinite}
.gull{animation:glide 16s ease-in-out infinite}
.bl{animation:blink 2.6s ease-in-out infinite}
.puff{transform-box:fill-box;transform-origin:center;animation:puff 6s ease-out infinite}
.trolL{animation:trolleyL 16s ease-in-out infinite alternate}
.trolR{animation:trolleyR 20s ease-in-out infinite alternate}
@media (prefers-reduced-motion: reduce) {
  .rise,.stars-a,.stars-b,.glow,.wv,.wv2,.ship,.gull,.bl,.puff,.trolL,.trolR{animation:none}
}
</style>
